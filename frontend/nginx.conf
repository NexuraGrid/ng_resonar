server {
    # nginx-unprivileged: the master runs as `nginx`, so it can't bind :80.
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Only JSON goes up (playlists, settings); the default is 1m already, set
    # explicitly so it isn't raised by accident.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json
               application/manifest+json image/svg+xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    # Static assets built by Vite are content-hashed and safe to cache hard.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        expires 1y;
    }

    # PWA: correct MIME for the manifest, and never let the SW go stale.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
    location = /sw.js {
        default_type application/javascript;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # The shell must revalidate so a deploy is picked up on the next load.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # API + audio stream proxy. Buffering is off so playback starts immediately
    # and Range requests (seeking) pass straight through to the backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # $http_host keeps the port (localhost:8899), which the backend's
        # Origin check compares against.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The origin is only ever reached over HTTPS (Cloudflare in front), so
        # the backend can treat the session cookie as Secure-eligible.
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
