# Included from every `location` that sets its own headers: nginx drops the
# server-level add_header directives in any block that declares its own.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Mov8ijBWEiIx4kOQpLcLqWf5j2M3DagB197u29yrnw4='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://cdn.plyr.io; connect-src 'self' https://cdn.plyr.io; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
